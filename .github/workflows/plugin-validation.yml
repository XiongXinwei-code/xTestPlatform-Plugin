name: 插件构建与产物验证

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          # .slnx needs a modern SDK; retain .NET 8 for plugin builds and metadata inspection.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: 还原解决方案和元数据检查工具
        run: |
          dotnet restore xTestPlatform-PluginDev.slnx -r win-x64 -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools/StepInfoExtractor/StepInfoExtractor.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools/WidgetInfoExtractor/WidgetInfoExtractor.csproj
      - name: 源码静态检查
        run: pwsh -NoProfile -File tools/Verify-PluginSources.ps1
      - name: 编译 LabVIEW 桥接程序
        run: dotnet build LabVIEWCall/LabVIEWCallBridgeHost/LabVIEWCallBridgeHost.csproj -c Release -r win-x64 --no-restore
      - name: 编译并校验独立插件目录
        run: pwsh -NoProfile -File tools/Verify-Plugins.ps1 -Mode Package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verification
          path: |
            artifacts/Release/2026-10-23-audit-fixes/verification
            artifacts/Release/2026-10-23-audit-fixes/build-manifest.json
      - name: 上传两个波形控件的可部署目录
        uses: actions/upload-artifact@v4
        with:
          name: waveform-widget-plugins
          if-no-files-found: error
          path: |
            artifacts/Release/2026-10-23-audit-fixes/Plugins/Waveform
            artifacts/Release/2026-10-23-audit-fixes/Plugins/SfWaveform
