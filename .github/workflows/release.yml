name: 自动发布插件（PR 合并后）

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

# 防止并发发布导致版本冲突
concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  PUBLISH_DIR: publish

jobs:
  auto-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: windows-latest

    steps:
      # ── 1. 检出 master 分支 ────────────────────────────────────────────
      - name: 检出 master 分支
        uses: actions/checkout@v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_TOKEN }}

      # ── 2. 自动递增版本号（基于最新 tag） ─────────────────────────────
      - name: 递增版本号
        id: bump_version
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestTag) {
              $version = $latestTag.TrimStart('v')
              $parts = $version.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2] + 1
          } else {
              $latestTag = ""
              $major = 1; $minor = 0; $patch = 0
          }
          $newVersion = "$major.$minor.$patch"
          $newTag = "v$newVersion"
          Write-Host "✅ 版本号已递增为 $newVersion（上一个 tag: $latestTag）"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "new_tag=$newTag" >> $env:GITHUB_OUTPUT
          echo "prev_tag=$latestTag" >> $env:GITHUB_OUTPUT

      # ── 3. 创建并推送 tag ──────────────────────────────────────────────
      - name: 创建并推送标签
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}
          if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ 标签推送失败: ${{ steps.bump_version.outputs.new_tag }}"
              exit 1
          }

      # ── 3.5 计算各插件版本号（不写回仓库，编译时注入） ──────────────────
      # 规则：插件版本 = 该插件目录最后一次提交所归属的最早 tag。
      # 本次有变更的插件自然落在新 tag 上；未变更的插件沿用历史版本，不会跳变。
      - name: 计算各插件版本号
        shell: pwsh
        run: |
          $newVersion = "${{ steps.bump_version.outputs.new_version }}"

          $pluginDirs = Get-ChildItem -Directory | Where-Object {
              (Get-ChildItem "$($_.FullName)" -Recurse -Filter "*Plugin*.csproj").Count -gt 0
          }

          $versions = [ordered]@{}
          foreach ($dir in $pluginDirs) {
              $v = $newVersion
              $lastCommit = git log -1 --format=%H -- "$($dir.Name)/"
              if ($lastCommit) {
                  $owning = git tag --contains $lastCommit |
                      Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                      ForEach-Object { [version]$_.TrimStart('v') } |
                      Sort-Object |
                      Select-Object -First 1
                  if ($owning) { $v = $owning.ToString() }
              }
              $versions[$dir.Name] = $v
              Write-Host "  🔖 $($dir.Name): v$v"
          }

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\plugin-versions.json", ($versions | ConvertTo-Json), $utf8)

      # ── 4. 安装 .NET 8 ─────────────────────────────────────────────────
      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── 5. 自动发现并编译所有插件 ──────────────────────────────────────
      - name: 编译所有插件
        shell: pwsh
        run: |
          # 约定：顶层目录中包含 *Plugin*.csproj 的即为插件目录（与版本递增步骤一致）
          $pluginDirs = Get-ChildItem -Directory | Where-Object {
              (Get-ChildItem "$($_.FullName)" -Recurse -Filter "*Plugin*.csproj").Count -gt 0
          }

          if ($pluginDirs.Count -eq 0) {
              Write-Error "❌ 未找到任何插件目录"
              exit 1
          }

          $publishRoot = "$env:GITHUB_WORKSPACE\${{ env.PUBLISH_DIR }}"
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null

          $versions = Get-Content "$env:GITHUB_WORKSPACE\plugin-versions.json" -Raw | ConvertFrom-Json

          foreach ($dir in $pluginDirs) {
              $v = $versions.$($dir.Name)
              Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              Write-Host "📦 编译插件: $($dir.Name)  (v$v)"
              $projects = Get-ChildItem "$($dir.FullName)" -Recurse -Filter "*.csproj"
              foreach ($proj in $projects) {
                  Write-Host "   🔨 $($proj.Name)"
                  dotnet build $proj.FullName `
                    -c Release -p:Platform=x64 `
                    -p:Version=$v `
                    -p:OutputPath="$publishRoot\$($dir.Name)"
                  if ($LASTEXITCODE -ne 0) {
                      Write-Error "❌ 编译失败: $($proj.Name)"
                      exit 1
                  }
              }
          }

          Write-Host "✅ 所有插件编译完成"

      # ── 6. 验证产物 ────────────────────────────────────────────────────
      - name: 验证编译产物
        shell: pwsh
        run: |
          $publishRoot = "$env:GITHUB_WORKSPACE\${{ env.PUBLISH_DIR }}"
          $pluginDirs = Get-ChildItem $publishRoot -Directory
          if ($pluginDirs.Count -eq 0) {
              Write-Error "❌ 未找到编译产物"
              exit 1
          }
          foreach ($dir in $pluginDirs) {
              Write-Host "📦 $($dir.Name):"
              Get-ChildItem $dir.FullName -File | ForEach-Object {
                  Write-Host "   $($_.Name)  ($([math]::Round($_.Length/1KB,1)) KB)"
              }
          }

      # ── 6.5 文档质量门禁（缺失仅警告，暂不阻断构建） ────────────────────────
      - name: 检查插件文档
        shell: pwsh
        run: |
          $pluginDirs = Get-ChildItem -Directory | Where-Object {
              (Get-ChildItem "$($_.FullName)" -Recurse -Filter "*Plugin*.csproj").Count -gt 0
          }
          foreach ($dir in $pluginDirs) {
              if (-not (Test-Path (Join-Path $dir.FullName "README.md"))) {
                  Write-Warning "$($dir.Name) 缺少 README.md，详情页将无功能介绍"
              }
              if (-not (Test-Path (Join-Path $dir.FullName "CHANGELOG.md"))) {
                  Write-Warning "$($dir.Name) 缺少 CHANGELOG.md，详情页更新记录将由提交记录自动兜底"
              }
          }

      # ── 7. 打包 ZIP（整包 + 单插件包 + manifest.json） ──────────────────
      - name: 打包 ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.bump_version.outputs.new_version }}"
          $tag     = "${{ steps.bump_version.outputs.new_tag }}"
          $zipName = "Plugins-v$version.zip"
          $publishRoot = "$env:GITHUB_WORKSPACE\${{ env.PUBLISH_DIR }}"
          $pluginVersions = Get-Content "$env:GITHUB_WORKSPACE\plugin-versions.json" -Raw | ConvertFrom-Json

          # ① 整包（离线全量包 / 兼容旧流程）
          Compress-Archive `
            -Path "$publishRoot\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\$zipName"

          $zipFile = Get-Item "$env:GITHUB_WORKSPACE\$zipName"
          Write-Host "✅ 已打包整包: $($zipFile.Name)  ($([math]::Round($zipFile.Length/1MB,2)) MB)"

          # ② 单插件包 + manifest 条目
          $assetsDir = "$env:GITHUB_WORKSPACE\assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          # 预先编译步骤信息提取工具（反射扫描 *.StepPlugin.dll）
          dotnet build tools\StepInfoExtractor\StepInfoExtractor.csproj -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ StepInfoExtractor 编译失败"
              exit 1
          }

          $entries = @()
          foreach ($dir in Get-ChildItem $publishRoot -Directory) {
              $pluginName = $dir.Name
              $pluginZip  = "$pluginName-v$version.zip"
              $pluginZipPath = Join-Path $assetsDir $pluginZip

              Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $pluginZipPath

              $sha256 = (Get-FileHash $pluginZipPath -Algorithm SHA256).Hash
              $size   = (Get-Item $pluginZipPath).Length

              # 插件版本：取自 3.5 步计算的结果（由 git tag 推导，未写回 csproj）
              $pluginVersion = $pluginVersions.$pluginName
              if (-not $pluginVersion) { $pluginVersion = $version }
              $desc = ""
              $csproj = Get-ChildItem "$env:GITHUB_WORKSPACE\$pluginName" -Recurse -Filter "*.csproj" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($csproj) {
                  $content = Get-Content $csproj.FullName -Raw
                  if ($content -match '<Description>([^<]+)</Description>') { $desc = $Matches[1].Trim() }
              }

              # 作者/公司：从插件主 DLL 的 CompanyName 提取（由 csproj/Directory.Build.props 的 <Company> 写入）
              $author = ""
              $mainDll = Get-ChildItem $dir.FullName -Filter "*.StepPlugin.dll" | Select-Object -First 1
              if (-not $mainDll) { $mainDll = Get-ChildItem $dir.FullName -Filter "*.dll" | Select-Object -First 1 }
              if ($mainDll) {
                  $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($mainDll.FullName)
                  if ($info.CompanyName) { $author = $info.CompanyName.Trim() }
              }

              # 发布时间：该插件目录最后一次实际提交时间（ISO 8601）
              $publishedAt = git log -1 --format=%cI -- "$pluginName/"
              if (-not $publishedAt) { $publishedAt = (Get-Date).ToString("o") }

              # 详情页内容：README（功能介绍）与 CHANGELOG（更新记录，缺失时用 git log 兜底）
              $readme = ""
              $changelog = ""
              $readmePath = Join-Path "$env:GITHUB_WORKSPACE\$pluginName" "README.md"
              $changelogPath = Join-Path "$env:GITHUB_WORKSPACE\$pluginName" "CHANGELOG.md"
              if (Test-Path $readmePath) { $readme = Get-Content $readmePath -Raw -Encoding UTF8 }

              if (Test-Path $changelogPath) {
                  # 优先：手写 CHANGELOG
                  $changelog = Get-Content $changelogPath -Raw -Encoding UTF8
              } else {
                  # 兜底：用该插件目录的提交记录自动生成本版本段落
                  $prevTag = "${{ steps.bump_version.outputs.prev_tag }}"
                  if ($prevTag) {
                      $log = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges -- "$pluginName/"
                  } else {
                      $log = git log --pretty=format:"- %s" --no-merges -- "$pluginName/"
                  }
                  if ($log) {
                      $changelog = "# 更新记录`n`n## v$pluginVersion - $(Get-Date -Format yyyy-MM-dd)`n$($log -join "`n")"
                      Write-Warning "$pluginName 缺少 CHANGELOG.md，已用提交记录自动生成，请尽快补写"
                  }
              }

              # 包含的步骤：反射扫描编译产物中的 *.StepPlugin.dll，提取所有 IStepPlugin 实现的 DisplayName/Description
              $steps = @()
              $stepsJson = dotnet run --project tools\StepInfoExtractor -c Release --no-build -- "$($dir.FullName)"
              if ($LASTEXITCODE -eq 0 -and $stepsJson) {
                  try {
                      $steps = @(($stepsJson -join "`n") | ConvertFrom-Json)
                  } catch {
                      Write-Warning "$pluginName 步骤信息 JSON 解析失败：$_"
                  }
              } else {
                  Write-Warning "$pluginName 步骤信息提取失败，详情页将无步骤列表"
              }
              if ($steps.Count -eq 0) { Write-Warning "$pluginName 未提取到任何步骤" }

              $entries += [ordered]@{
                  name               = $pluginName
                  version            = $pluginVersion
                  description        = $desc
                  author             = $author
                  publishedAt        = $publishedAt
                  downloadUrl        = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$pluginZip"
                  sha256             = $sha256
                  size               = $size
                  minPlatformVersion = ""
                  readme             = $readme
                  changelog          = $changelog
                  steps              = $steps
              }
              Write-Host "  📦 $pluginZip  v$pluginVersion  ($([math]::Round($size/1KB,1)) KB)"
          }

          # ③ 生成 manifest.json
          $manifest = [ordered]@{
              manifestVersion = 1
              releaseTag      = $tag
              plugins         = $entries
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$assetsDir\manifest.json" -Encoding UTF8
          Write-Host "✅ manifest.json 已生成（$($entries.Count) 个插件）"

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── 8. 生成 Release Notes ─────────────────────────────────────────
      - name: 生成 Release Notes
        shell: pwsh
        run: |
          $currentTag = "${{ steps.bump_version.outputs.new_tag }}"
          $tags = git tag --sort=-v:refname
          $index = [array]::IndexOf($tags, $currentTag)
          if ($index -ge 0 -and $index -lt ($tags.Count - 1)) {
              $previousTag = $tags[$index + 1]
              $log = git log "$previousTag..$currentTag" --pretty=format:"- %s (%an)" --no-merges
          } else {
              # 首个版本或未找到前一个标签，仅记录最近一次提交
              $log = git log -1 --pretty=format:"- %s (%an)" --no-merges
              if (-not $log) { $log = "初始版本发布。" }
          }
          if (-not $log) { $log = "无代码变更，仅版本更新。" }
          Set-Content -Path "$env:GITHUB_WORKSPACE\release_notes.md" -Value $log -Encoding UTF8
          Write-Host "✅ Release Notes 已生成"
          Get-Content "$env:GITHUB_WORKSPACE\release_notes.md"

      # ── 9. 创建 GitHub Release 并上传附件 ─────────────────────────────
      - name: 创建 Release 并上传插件包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          name: "${{ steps.bump_version.outputs.new_tag }}"
          body_path: ${{ github.workspace }}\release_notes.md
          files: |
            ${{ env.ZIP_NAME }}
            assets/*.zip
            assets/manifest.json
          generate_release_notes: false
          token: ${{ secrets.PLUGIN_TOKEN }}

      # ── 9.1 删除历史发布和标签 ──────────────────────────────────────────
      - name: 删除历史发布和标签
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_TOKEN }}
        run: |
          # 保留最近 3 个版本，删除更早的发布和标签
          $allTags = gh release list --json tagName --jq '.[].tagName'
          $keepTags = @($allTags | Select-Object -First 3)
          $toDelete = $allTags | Select-Object -Skip 3
          foreach ($tag in $toDelete) {
            Write-Host "🗑️ 删除发布: $tag"
            gh release delete $tag --yes --cleanup-tag
          }

          # 兜底清理：删除所有不在保留列表中的远程 tag（包括无 Release 的孤儿 tag）
          $remoteTags = git ls-remote --tags origin |
              ForEach-Object { ($_ -split "`t")[1] } |
              Where-Object { $_ -notmatch '\^\{\}$' } |
              ForEach-Object { $_ -replace '^refs/tags/', '' }
          foreach ($tag in $remoteTags) {
            if ($keepTags -notcontains $tag) {
              Write-Host "🗑️ 删除残留标签: $tag"
              git push origin --delete "refs/tags/$tag"
            }
          }
          Write-Host "✅ 历史发布和标签已清理完毕（保留最近 3 个版本）"

      # ── 10. 更新版本清单
      - name: 更新版本清单
        shell: pwsh
        run: |
          $tag         = "${{ steps.bump_version.outputs.new_tag }}"
          $version     = "${{ steps.bump_version.outputs.new_version }}"
          $zipName     = $env:ZIP_NAME
          $zipFile     = Get-Item "$env:GITHUB_WORKSPACE\$zipName"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$zipName"

          $manifest = [ordered]@{
            version      = $version
            releaseName  = "xTestPlatform-Plugins $tag"
            releaseNotes = "请访问 GitHub Release 页面查看完整更新说明。"
            htmlUrl      = "https://github.com/${{ github.repository }}/releases/tag/$tag"
            assets       = @(
              [ordered]@{
                name        = $zipName
                downloadUrl = $downloadUrl
                size        = $zipFile.Length
              }
            )
          }

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\docs" | Out-Null
          $manifest | ConvertTo-Json -Depth 5 |
            Set-Content "$env:GITHUB_WORKSPACE\docs\version.json" -Encoding UTF8

          Write-Host "✅ version.json 已生成"
          Write-Host "   版本:  $version"
          Write-Host "   文件:  $zipName"
          Write-Host "   大小:  $([math]::Round($zipFile.Length/1MB,2)) MB"
          Write-Host "   下载:  $downloadUrl"

      # ── 11. 将 version.json 提交回 master 分支 ────────────────────────
      - name: 提交版本清单到 master
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/version.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "version.json 无变化，跳过提交"
          } else {
            git commit -m "chore: 更新版本清单至 ${{ steps.bump_version.outputs.new_tag }} [skip ci]"
            git push origin HEAD:master
          }