name: 自动发布插件（PR 合并后）

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

# 防止并发发布导致版本冲突
concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  PUBLISH_DIR: publish
  # 保留的历史 Release 数量。插件管理器的"安装历史版本"只能装这些仍存在的 Release，
  # 被清理掉的版本其 zip 下载链接会失效，因此该值决定可回退的版本深度。
  KEEP_RELEASES: "10"

jobs:
  auto-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: windows-latest

    steps:
      # ── 1. 检出 master 分支 ────────────────────────────────────────────
      - name: 检出 master 分支
        uses: actions/checkout@v4.2.2
        with:
          ref: refs/heads/master
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_TOKEN }}

      # ── 2. 自动递增版本号（基于最新 tag） ─────────────────────────────
      - name: 递增版本号
        id: bump_version
        shell: pwsh
        run: |
          $latestTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $latestTag) {
              $version = $latestTag.TrimStart('v')
              $parts = $version.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2] + 1
          } else {
              $latestTag = ""
              $major = 1; $minor = 0; $patch = 0
          }
          $newVersion = "$major.$minor.$patch"
          $newTag = "v$newVersion"
          Write-Host "✅ 版本号已递增为 $newVersion（上一个 tag: $latestTag）"
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "new_tag=$newTag" >> $env:GITHUB_OUTPUT
          echo "prev_tag=$latestTag" >> $env:GITHUB_OUTPUT

      # ── 3.5 计算各插件版本号（不写回仓库，编译时注入） ──────────────────
      # 规则：插件版本 = 其编译输入最后一次提交所归属的最早 tag（含私有源码链接和根构建配置）。
      # 本次有变更的插件自然落在新 tag 上；未变更的插件沿用历史版本，不会跳变。
      - name: 计算各插件版本号
        shell: pwsh
        run: |
          $newVersion = "${{ steps.bump_version.outputs.new_version }}"
          $versions = [ordered]@{}
          foreach ($module in ./tools/Get-ReleasePluginModules.ps1) {
              $v = $newVersion
              $inputs = @("$($module.SourcePath)/", 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'global.json')
              if ($module.StepProjects.Count) { $inputs += 'Shared/' }
              if ($module.WidgetProjects.Count) { $inputs += 'LocalPackages/xTestPlatform.DashboardWidget.SDK.*.nupkg' }
              if ($module.Name -eq 'CiA402') { $inputs += 'CAN/' }
              $lastCommit = git log -1 --format=%H -- @inputs
              if ($LASTEXITCODE -ne 0 -or -not $lastCommit) { throw "$($module.Name) 缺少编译输入的提交历史" }
              $owning = git tag --contains $lastCommit |
                  Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                  ForEach-Object { [version]$_.TrimStart('v') } |
                  Sort-Object | Select-Object -First 1
              if ($owning) { $v = $owning.ToString() }
              $versions[$module.Name] = $v
              Write-Host "  🔖 $($module.Name): v$v"
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\plugin-versions.json", ($versions | ConvertTo-Json), $utf8)

      # .slnx 构建使用现代 SDK；插件和测试仍以 .NET 8 为目标。
      - name: 安装构建 SDK 与 .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}
            10.0.x

      - name: 源码检查与发布编译准备
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Verify-PluginSources.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore xTestPlatform-PluginDev.slnx -r win-x64 -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build LabVIEWCall/LabVIEWCallBridgeHost/LabVIEWCallBridgeHost.csproj -c Release -r win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 5. 自动发现并编译所有插件 ──────────────────────────────────────
      - name: 编译所有插件
        shell: pwsh
        run: |
          $publishRoot = "$env:GITHUB_WORKSPACE\${{ env.PUBLISH_DIR }}"
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          $versions = Get-Content "$env:GITHUB_WORKSPACE\plugin-versions.json" -Raw | ConvertFrom-Json -AsHashtable
          foreach ($module in ./tools/Get-ReleasePluginModules.ps1) {
              $version = $versions[$module.Name]
              if (-not $version) { throw "$($module.Name) 缺少发布版本" }
              $destination = Join-Path $publishRoot $module.Name
              foreach ($project in $module.Projects) {
                  Write-Host "编译 $project (v$version)"
                  dotnet build $project -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=false -p:AppendRuntimeIdentifierToOutputPath=false "-p:Version=$version" "-p:OutputPath=$destination"
                  if ($LASTEXITCODE -ne 0) { throw "编译失败：$project" }
              }
          }

      # ── 6. 验证产物 ────────────────────────────────────────────────────
      - name: 验证编译产物
        shell: pwsh
        run: |
          $publishRoot = "$env:GITHUB_WORKSPACE\${{ env.PUBLISH_DIR }}"
          foreach ($module in ./tools/Get-ReleasePluginModules.ps1) {
              $destination = Join-Path $publishRoot $module.Name
              foreach ($project in $module.Projects) {
                  $xml = [xml](Get-Content -LiteralPath $project -Raw -Encoding UTF8)
                  $assembly = @($xml.Project.PropertyGroup.AssemblyName | Where-Object { $_ })[0]
                  if (-not $assembly -or -not (Test-Path -LiteralPath (Join-Path $destination "$assembly.dll") -PathType Leaf)) {
                      throw "缺少发布程序集：$project → $destination/$assembly.dll"
                  }
              }
              Write-Host "已核对 $($module.Name) 的发布程序集"
          }

      # ── 6.5 文档校验（控件必须包含说明与变更记录） ────────────────────────
      - name: 检查插件文档
        shell: pwsh
        run: |
          foreach ($module in ./tools/Get-ReleasePluginModules.ps1) {
              foreach ($file in 'README.md', 'CHANGELOG.md') {
                  if (-not (Test-Path -LiteralPath (Join-Path $module.SourcePath $file) -PathType Leaf)) {
                      if ($module.WidgetProjects.Count) { throw "$($module.SourcePath) 缺少必需的 $file" }
                      Write-Warning "$($module.SourcePath) 缺少 $file"
                  }
              }
          }

      # ── 7. 打包 ZIP（整包 + 单插件包 + manifest.json） ──────────────────
      - name: 打包 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.bump_version.outputs.new_version }}"
          $tag = "${{ steps.bump_version.outputs.new_tag }}"
          $prevTag = "${{ steps.bump_version.outputs.prev_tag }}"
          $zipName = "Plugins-v$version.zip"
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_DIR
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE "assets"
          $modules = @(./tools/Get-ReleasePluginModules.ps1)
          if (-not $modules.Count) { throw "发布模块清单为空" }
          $pluginVersions = Get-Content "$env:GITHUB_WORKSPACE\plugin-versions.json" -Raw | ConvertFrom-Json
          [xml]$packageProps = Get-Content "$env:GITHUB_WORKSPACE\Directory.Packages.props" -Raw
          $widgetSdkVersion = ($packageProps.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'xTestPlatform.DashboardWidget.SDK').Version

          foreach ($tool in 'StepInfoExtractor', 'WidgetInfoExtractor') {
              dotnet build "tools/$tool/$tool.csproj" -c Release --nologo -v q
              if ($LASTEXITCODE -ne 0) { throw "$tool 编译失败" }
          }
          function Read-PluginMetadata([string]$tool, [string]$path) {
              $json = dotnet run --project "tools/$tool/$tool.csproj" -c Release --no-build -- $path --strict
              if ($LASTEXITCODE -ne 0 -or -not $json) { throw "$path 的 $tool 严格校验失败" }
              $records = @(($json -join [Environment]::NewLine) | ConvertFrom-Json -ErrorAction Stop)
              if (-not $records.Count) { throw "$tool 未在 $path 提取到声明的插件类型" }
              $records
          }

          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          $entries = @()
          foreach ($module in $modules) {
              $pluginName = $module.Name
              $sourceDir = Join-Path $env:GITHUB_WORKSPACE $module.SourcePath
              $dir = Get-Item -LiteralPath (Join-Path $publishRoot $pluginName) -ErrorAction Stop
              $pluginVersion = $pluginVersions.$pluginName
              if (-not $pluginVersion) { throw "$pluginName 缺少发布版本" }

              $steps = @()
              $widgets = @()
              $pluginTypes = @()
              if ($module.StepProjects.Count) {
                  $steps = @(Read-PluginMetadata StepInfoExtractor $dir.FullName)
                  $pluginTypes += 'Step'
              }
              if ($module.WidgetProjects.Count) {
                  if (-not $widgetSdkVersion) { throw "缺少控件 SDK 基线版本" }
                  $widgets = @(Read-PluginMetadata WidgetInfoExtractor $dir.FullName)
                  $pluginTypes += 'Widget'
              }
              if (-not $pluginTypes.Count) { throw "$pluginName 未声明步骤或控件项目" }

              # 只读取本模块自己的项目及主程序集，避免误取私有依赖 DLL 的作者或描述。
              $coreProjects = @($module.StepProjects) + @($module.WidgetProjects)
              [xml]$project = Get-Content -Raw -Encoding UTF8 -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $coreProjects[0])
              $desc = [string](@($project.Project.PropertyGroup.Description | Where-Object { $_ })[0])
              $assemblyName = @($project.Project.PropertyGroup.AssemblyName | Where-Object { $_ })[0]
              if (-not $assemblyName) { $assemblyName = [IO.Path]::GetFileNameWithoutExtension($coreProjects[0]) }
              $mainDll = Get-Item -LiteralPath (Join-Path $dir.FullName "$assemblyName.dll") -ErrorAction Stop
              $author = [string][Diagnostics.FileVersionInfo]::GetVersionInfo($mainDll.FullName).CompanyName

              $publishedAt = git log -1 --format=%cI -- $module.SourcePath
              if ($LASTEXITCODE -ne 0) { throw "$pluginName 提交日期读取失败" }
              if (-not $publishedAt) { $publishedAt = (Get-Date).ToString("o") }
              $readme = ""
              $changelog = ""
              $icon = ""
              foreach ($file in 'README.md', 'CHANGELOG.md', 'icon.png') {
                  $source = Join-Path $sourceDir $file
                  if (Test-Path -LiteralPath $source -PathType Leaf) {
                      Copy-Item -LiteralPath $source -Destination (Join-Path $dir.FullName $file) -Force
                      switch ($file) {
                          'README.md'    { $readme = Get-Content -Raw -Encoding UTF8 -LiteralPath $source }
                          'CHANGELOG.md' { $changelog = Get-Content -Raw -Encoding UTF8 -LiteralPath $source }
                          'icon.png'     { $icon = [Convert]::ToBase64String([IO.File]::ReadAllBytes($source)) }
                      }
                  } elseif ($module.WidgetProjects.Count -and $file -ne 'icon.png') {
                      throw "$pluginName 缺少必需的控件文档 $file"
                  }
              }
              if (-not $changelog) {
                  $range = if ($prevTag) { "$prevTag..HEAD" } else { "HEAD" }
                  $log = git log $range --pretty=format:"- %s" --no-merges -- $module.SourcePath
                  if ($LASTEXITCODE -ne 0) { throw "$pluginName 提交记录读取失败" }
                  if ($log) {
                      $changelog = (@("# 更新记录", "", "## v$pluginVersion - $(Get-Date -Format yyyy-MM-dd)") + $log) -join [Environment]::NewLine
                      Write-Warning "$pluginName 从提交记录生成了更新说明"
                  }
              }

              $pluginZip = "$pluginName-v$version.zip"
              $pluginZipPath = Join-Path $assetsDir $pluginZip
              Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $pluginZipPath -Force
              $sha256 = (Get-FileHash -LiteralPath $pluginZipPath -Algorithm SHA256).Hash
              $size = (Get-Item -LiteralPath $pluginZipPath).Length
              $entries += [ordered]@{
                  name               = $pluginName
                  version            = $pluginVersion
                  description        = $desc
                  author             = $author
                  publishedAt        = $publishedAt
                  downloadUrl        = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$pluginZip"
                  sha256             = $sha256
                  size               = $size
                  minPlatformVersion = ""
                  minWidgetSdkVersion = $(if ($widgets.Count) { $widgetSdkVersion } else { "" })
                  maxWidgetSdkVersion = ""
                  targetFramework    = $(if ($widgets.Count) { "net8.0-windows" } else { "" })
                  architecture       = "x64"
                  pluginTypes        = $pluginTypes
                  readme             = $readme
                  changelog          = $changelog
                  icon               = $icon
                  steps              = $steps
                  widgets            = $widgets
              }
              Write-Host "📦 $pluginZip  v$pluginVersion  ($([math]::Round($size/1KB,1)) KB)"
          }
          # 保留原整包目录结构，仅纳入此次发布清单中的模块。
          $moduleDirs = @($modules | ForEach-Object { Join-Path $publishRoot $_.Name })
          Compress-Archive -LiteralPath $moduleDirs -DestinationPath (Join-Path $env:GITHUB_WORKSPACE $zipName) -Force
          $manifest = [ordered]@{
              manifestVersion = 1
              releaseTag      = $tag
              plugins         = $entries
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "$assetsDir\manifest.json" -Encoding UTF8
          Write-Host "✅ $zipName 和 manifest.json 已生成（$($entries.Count) 个插件）"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── 7.5 生成历史版本索引 versions.json ─────────────────────────────
      # 客户端「安装历史版本」依赖该文件。做法：继承上一个 Release 的 versions.json，
      # 追加本次各插件条目，并剔除已被清理（Release 不存在）的版本，避免出现死链。
      - name: 生成历史版本索引
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_TOKEN }}
        run: |
          $tag = "${{ steps.bump_version.outputs.new_tag }}"
          $assetsDir = "$env:GITHUB_WORKSPACE\assets"
          $manifest = Get-Content "$assetsDir\manifest.json" -Raw -Encoding UTF8 | ConvertFrom-Json

          # ① 继承上一个 Release 的历史索引（首次发布时为空）
          $history = @{}
          $prevIndexPath = "$env:GITHUB_WORKSPACE\prev-versions.json"
          gh release download --pattern "versions.json" --output $prevIndexPath 2>$null
          if ($LASTEXITCODE -eq 0 -and (Test-Path $prevIndexPath)) {
              try {
                  $prev = Get-Content $prevIndexPath -Raw -Encoding UTF8 | ConvertFrom-Json
                  foreach ($p in $prev.plugins) {
                      $history[$p.name] = @($p.versions)
                  }
                  Write-Host "📥 已继承上一版历史索引（$($history.Keys.Count) 个插件）"
              } catch {
                  Write-Warning "上一版 versions.json 解析失败，将重新生成：$_"
                  $history = @{}
              }
          } else {
              Write-Host "ℹ️ 未找到上一版 versions.json，按首次发布处理"
          }

          # ② 追加本次发布的各插件版本（同版本号去重，以本次为准）
          foreach ($e in $manifest.plugins) {
              $list = @()
              if ($history.ContainsKey($e.name)) {
                  $list = @($history[$e.name] | Where-Object { $_.version -ne $e.version })
              }
              $list = @([pscustomobject][ordered]@{
                  version     = $e.version
                  releaseTag  = $tag
                  publishedAt = $e.publishedAt
                  downloadUrl = $e.downloadUrl
                  sha256      = $e.sha256
                  size        = $e.size
                  changelog   = $e.changelog
              }) + $list
              $history[$e.name] = $list
          }

          # ③ 剔除将被清理掉的 Release 对应的版本（下载链接会失效）
          # 保留列表 = 本次 tag + 现有 Release 中最新的 (KEEP_RELEASES - 1) 个
          $keep = [int]"${{ env.KEEP_RELEASES }}"
          $existing = @(gh release list --json tagName --jq '.[].tagName')
          $keepTags = @($tag) + @($existing | Where-Object { $_ -ne $tag } | Select-Object -First ($keep - 1))
          Write-Host "🔖 历史索引保留的发布包: $($keepTags -join ', ')"

          $plugins = @()
          foreach ($name in ($history.Keys | Sort-Object)) {
              $valid = @($history[$name] | Where-Object { $keepTags -contains $_.releaseTag })
              if ($valid.Count -eq 0) { continue }
              # 按版本号语义倒序，最新在前（同一插件未变更时多个 Release 的 publishedAt 相同，不能用时间排序）
              $valid = @($valid | Sort-Object -Property @{ Expression = {
                  try { [version]($_.version -replace '^[vV]', '') } catch { [version]"0.0.0" }
              } } -Descending)
              $plugins += [ordered]@{
                  name     = $name
                  versions = $valid
              }
              Write-Host "  🕘 $name : $($valid.Count) 个可安装版本"
          }

          $index = [ordered]@{
              indexVersion = 1
              generatedAt  = (Get-Date).ToString("o")
              plugins      = $plugins
          }
          $index | ConvertTo-Json -Depth 6 | Set-Content "$assetsDir\versions.json" -Encoding UTF8
          Write-Host "✅ versions.json 已生成（$($plugins.Count) 个插件）"

      # ── 7.9 构建/打包成功后创建并推送 tag ──────────────────────────────────────────────
      - name: 创建并推送标签
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump_version.outputs.new_tag }}
          git push origin ${{ steps.bump_version.outputs.new_tag }}
          if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ 标签推送失败: ${{ steps.bump_version.outputs.new_tag }}"
              exit 1
          }

      # ── 8. 生成 Release Notes ─────────────────────────────────────────
      - name: 生成 Release Notes
        shell: pwsh
        run: |
          $currentTag = "${{ steps.bump_version.outputs.new_tag }}"
          $tags = git tag --sort=-v:refname
          $index = [array]::IndexOf($tags, $currentTag)
          if ($index -ge 0 -and $index -lt ($tags.Count - 1)) {
              $previousTag = $tags[$index + 1]
              $log = git log "$previousTag..$currentTag" --pretty=format:"- %s (%an)" --no-merges
          } else {
              # 首个版本或未找到前一个标签，仅记录最近一次提交
              $log = git log -1 --pretty=format:"- %s (%an)" --no-merges
              if (-not $log) { $log = "初始版本发布。" }
          }
          if (-not $log) { $log = "无代码变更，仅版本更新。" }
          Set-Content -Path "$env:GITHUB_WORKSPACE\release_notes.md" -Value $log -Encoding UTF8
          Write-Host "✅ Release Notes 已生成"
          Get-Content "$env:GITHUB_WORKSPACE\release_notes.md"

      # ── 9. 创建 GitHub Release 并上传附件 ─────────────────────────────
      - name: 创建 Release 并上传插件包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          name: "${{ steps.bump_version.outputs.new_tag }}"
          body_path: ${{ github.workspace }}\release_notes.md
          files: |
            ${{ env.ZIP_NAME }}
            assets/*.zip
            assets/manifest.json
            assets/versions.json
          generate_release_notes: false
          token: ${{ secrets.PLUGIN_TOKEN }}

      # ── 9.1 删除历史发布和标签 ──────────────────────────────────────────
      - name: 删除历史发布和标签
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_TOKEN }}
        run: |
          # 保留最近 KEEP_RELEASES 个版本，删除更早的发布和标签
          # 保留数与 versions.json 的过滤规则一致，保证历史版本索引中不出现死链
          $keep = [int]"${{ env.KEEP_RELEASES }}"
          $allTags = gh release list --json tagName --jq '.[].tagName'
          $keepTags = @($allTags | Select-Object -First $keep)
          $toDelete = $allTags | Select-Object -Skip $keep
          foreach ($tag in $toDelete) {
            Write-Host "🗑️ 删除发布: $tag"
            gh release delete $tag --yes --cleanup-tag
          }

          # 兜底清理：删除所有不在保留列表中的远程 tag（包括无 Release 的孤儿 tag）
          $remoteTags = git ls-remote --tags origin |
              ForEach-Object { ($_ -split "`t")[1] } |
              Where-Object { $_ -notmatch '\^\{\}$' } |
              ForEach-Object { $_ -replace '^refs/tags/', '' }
          foreach ($tag in $remoteTags) {
            if ($keepTags -notcontains $tag) {
              Write-Host "🗑️ 删除残留标签: $tag"
              git push origin --delete "refs/tags/$tag"
            }
          }
          Write-Host "✅ 历史发布和标签已清理完毕（保留最近 $keep 个版本）"

      # 客户端 xTestPluginManager 固定从 releases/latest/download/manifest.json
      # 获取插件清单，从 releases/latest/download/versions.json 获取历史版本索引，
      # 不读取 docs/version.json，因此流水线无需向 master 写回文件。
